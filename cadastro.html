
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | BYTE STORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="py-3 bg-white border-bottom">
        <div class="container d-flex justify-content-between align-items-center">

            <a href="index.html" class="text-decoration-none">
                <h2 class="fw-bold mb-0">
                    BYTE <span class="text-primary">STORE</span>
                </h2>
            </a>

            <nav class="d-flex gap-4">
                <a href="index.html" class="text-dark text-decoration-none">Início</a>
                <a href="produtos.html" class="text-dark text-decoration-none">Produtos</a>
                <a href="login.html" class="text-dark text-decoration-none">Entrar</a>
            </nav>

        </div>
    </header>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h1 class="fw-bold">Criar conta</h1>
                            <p class="text-secondary">
                                Cadastre-se para aproveitar a BYTE STORE.
                            </p>
                        </div>

                        <form id="formCadastro">

                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input
                                    type="text"
                                    id="nome"
                                    class="form-control"
                                    placeholder="Digite seu nome completo"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Digite seu e-mail"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input
                                    type="tel"
                                    id="telefone"
                                    class="form-control"
                                    placeholder="(00) 00000-0000"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input
                                    type="password"
                                    id="senha"
                                    class="form-control"
                                    placeholder="Crie uma senha"
                                    minlength="6"
                                    required>
                            </div>

                            <div class="mb-4">
                                <label for="confirmarSenha" class="form-label">
                                    Confirmar senha
                                </label>

                                <input
                                    type="password"
                                    id="confirmarSenha"
                                    class="form-control"
                                    placeholder="Digite sua senha novamente"
                                    required>
                            </div>

                            <div class="form-check mb-4">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="termos"
                                    required>

                                <label class="form-check-label" for="termos">
                                    Concordo com os termos de uso e a política de privacidade.
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Criar minha conta
                            </button>

                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                Já possui uma conta?
                                <a href="login.html" class="text-primary fw-bold text-decoration-none">
                                    Fazer login
                                </a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>

        </div>

    </main>

    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">&copy; 2026 BYTE STORE. Todos os direitos reservados.</p>
    </footer>

    <script>
        const formulario = document.getElementById("formCadastro");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;

            if (senha !== confirmarSenha) {
                alert("As senhas não são iguais. Verifique e tente novamente.");
                return;
            }

            alert("Cadastro demonstrativo realizado! O sistema de contas será implementado posteriormente.");

            window.location.href = "login.html";
        });
    </script>

</body>
</html>
