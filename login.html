
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BYTE STORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="py-3 bg-white border-bottom">
        <div class="container d-flex justify-content-between align-items-center">

            <a href="index.html" class="text-decoration-none">
                <h2 class="fw-bold mb-0">
                    BYTE <span class="text-primary">STORE</span>
                </h2>
            </a>

            <nav class="d-flex gap-4">
                <a href="index.html" class="text-dark text-decoration-none">Início</a>
                <a href="produtos.html" class="text-dark text-decoration-none">Produtos</a>
                <a href="carrinho.html" class="text-dark text-decoration-none">Carrinho</a>
            </nav>

        </div>
    </header>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h1 class="fw-bold">Bem-vindo!</h1>
                            <p class="text-secondary">
                                Entre na sua conta da BYTE STORE.
                            </p>
                        </div>

                        <form id="formLogin">

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Digite seu e-mail"
                                    autocomplete="email"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input
                                    type="password"
                                    id="senha"
                                    name="senha"
                                    class="form-control"
                                    placeholder="Digite sua senha"
                                    autocomplete="current-password"
                                    required>
                            </div>

                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="lembrar">

                                    <label class="form-check-label" for="lembrar">
                                        Lembrar de mim
                                    </label>
                                </div>

                                <a href="#" id="esqueceuSenha" class="text-primary text-decoration-none">
                                    Esqueceu a senha?
                                </a>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Entrar
                            </button>

                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                Ainda não tem uma conta?
                                <a href="cadastro.html" class="text-primary fw-bold text-decoration-none">
                                    Cadastre-se
                                </a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>

        </div>

    </main>

    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">&copy; 2026 BYTE STORE. Todos os direitos reservados.</p>
    </footer>

    <script>
        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Tela de login funcionando! A autenticação será implementada posteriormente.");
        });

        document.getElementById("esqueceuSenha").addEventListener("click", function(event) {
            event.preventDefault();

            alert("A recuperação de senha estará disponível em breve.");
        });
    </script>

</body>
</html>
