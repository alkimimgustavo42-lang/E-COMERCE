
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produto | BYTE STORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="py-3 bg-white border-bottom">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">

            <a href="index.html" class="text-decoration-none">
                <h2 class="fw-bold mb-0 text-dark">
                    BYTE <span class="text-primary">STORE</span>
                </h2>
            </a>

            <nav class="d-flex gap-4 flex-wrap">
                <a href="index.html" class="text-dark text-decoration-none">Início</a>
                <a href="produtos.html" class="text-dark text-decoration-none">Produtos</a>
                <a href="index.html#sobre" class="text-dark text-decoration-none">Sobre</a>
                <a href="carrinho.html" class="text-dark text-decoration-none">Carrinho</a>
            </nav>

        </div>
    </header>

    <main class="container py-5">

        <div class="mb-4">
            <a href="produtos.html" class="text-decoration-none text-primary">
                ← Voltar aos produtos
            </a>
        </div>

        <div class="row g-5 align-items-center">

            <div class="col-md-6">
                <div class="bg-light rounded p-3">
                    <img
                        id="imagemProduto"
                        src=""
                        alt=""
                        class="img-fluid rounded w-100">
                </div>
            </div>

            <div class="col-md-6">

                <span class="badge bg-primary mb-3" id="categoriaProduto"></span>

                <h1 class="fw-bold" id="nomeProduto"></h1>

                <p class="text-secondary mt-3" id="descricaoProduto"></p>

                <h2 class="text-primary fw-bold my-4" id="precoProduto"></h2>

                <p class="text-success fw-semibold">
                    <span class="badge bg-success">Em estoque</span>
                </p>

                <div class="mb-4">
                    <label for="quantidade" class="form-label fw-bold">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        class="form-control"
                        value="1"
                        min="1"
                        max="10"
                        style="max-width: 110px;">
                </div>

                <button
                    class="btn btn-primary btn-lg w-100 mb-3"
                    type="button"
                    id="adicionarCarrinho">
                    Adicionar ao carrinho
                </button>

                <a href="produtos.html" class="btn btn-outline-dark btn-lg w-100">
                    Continuar comprando
                </a>

                <p class="text-secondary mt-4">
                    <strong>Compra demonstrativa:</strong>
                    a integração real do carrinho será feita na próxima etapa.
                </p>

            </div>
        </div>

        <section class="mt-5 pt-4 border-top">

            <h3 class="fw-bold mb-3">Descrição do produto</h3>

            <p class="text-secondary" id="descricaoCompleta"></p>

            <h4 class="fw-bold mt-4">Informações técnicas</h4>

            <ul class="text-secondary" id="informacoesTecnicas"></ul>

        </section>

    </main>

    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">&copy; 2026 BYTE STORE. Todos os direitos reservados.</p>
    </footer>

    <script>
        const produtos = {

            notebook: {
                nome: "Notebook Pro",
                categoria: "Computadores",
                preco: 3499.90,
                imagem: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=1000",
                descricao: "Alto desempenho para estudos, trabalho e entretenimento.",
                descricaoCompleta: "O Notebook Pro é uma opção para quem busca um equipamento versátil para estudos, trabalho e entretenimento. Seu design moderno combina com diferentes ambientes e oferece praticidade para as tarefas do cotidiano.",
                informacoes: [
                    "Categoria: Computadores",
                    "Modelo: Notebook Pro",
                    "Cor: Prata",
                    "Conectividade: Wi-Fi e Bluetooth",
                    "Uso indicado: Estudos e trabalho",
                    "Garantia: 12 meses"
                ]
            },

            headphone: {
                nome: "Headphone Wireless",
                categoria: "Áudio",
                preco: 299.90,
                imagem: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1000",
                descricao: "Áudio de qualidade e conexão sem fio para sua rotina.",
                descricaoCompleta: "O Headphone Wireless oferece praticidade para ouvir músicas, assistir a vídeos e participar de chamadas. Seu formato foi pensado para proporcionar conforto durante o uso.",
                informacoes: [
                    "Categoria: Áudio",
                    "Modelo: Headphone Wireless",
                    "Conectividade: Bluetooth",
                    "Tipo: Sem fio",
                    "Uso indicado: Música e chamadas",
                    "Garantia: 12 meses"
                ]
            },

            smartwatch: {
                nome: "Smartwatch",
                categoria: "Acessórios",
                preco: 459.90,
                imagem: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=1000",
                descricao: "Tecnologia e praticidade para acompanhar sua rotina.",
                descricaoCompleta: "O Smartwatch é um relógio inteligente que reúne recursos tecnológicos em um só acessório. Uma opção prática para acompanhar informações e facilitar algumas tarefas do dia a dia.",
                informacoes: [
                    "Categoria: Acessórios",
                    "Modelo: Smartwatch",
                    "Tipo: Relógio inteligente",
                    "Conectividade: Bluetooth",
                    "Design: Moderno",
                    "Garantia: 12 meses"
                ]
            },

            smartphone: {
                nome: "Smartphone Plus",
                categoria: "Smartphones",
                preco: 1899.90,
                imagem: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=1000",
                descricao: "Desempenho e tecnologia em um só aparelho.",
                descricaoCompleta: "O Smartphone Plus é uma opção para quem procura praticidade para comunicação, estudos, trabalho e entretenimento. Seu design moderno combina com as necessidades do cotidiano.",
                informacoes: [
                    "Categoria: Smartphones",
                    "Modelo: Smartphone Plus",
                    "Conectividade: Wi-Fi e Bluetooth",
                    "Tipo: Celular",
                    "Uso indicado: Comunicação e entretenimento",
                    "Garantia: 12 meses"
                ]
            },

            mouse: {
                nome: "Mouse Gamer",
                categoria: "Periféricos",
                preco: 149.90,
                imagem: "https://images.unsplash.com/photo-1527814050087-3793815479db?w=1000",
                descricao: "Precisão e conforto para sua rotina no computador.",
                descricaoCompleta: "O Mouse Gamer é um periférico desenvolvido para oferecer praticidade durante o uso do computador. É uma opção para atividades do dia a dia, estudos e jogos.",
                informacoes: [
                    "Categoria: Periféricos",
                    "Modelo: Mouse Gamer",
                    "Tipo: Mouse para computador",
                    "Uso indicado: Estudos, trabalho e jogos",
                    "Conexão: USB",
                    "Garantia: 12 meses"
                ]
            }

        };

        const parametros = new URLSearchParams(window.location.search);
        const identificador = parametros.get("produto");

        const produto = produtos[identificador];

        if (!produto) {
            document.querySelector("main").innerHTML = `
                <div class="text-center py-5">
                    <h2 class="fw-bold">Produto não encontrado</h2>
                    <p class="text-secondary">
                        Não foi possível localizar esse produto.
                    </p>
                    <a href="produtos.html" class="btn btn-primary">
                        Voltar aos produtos
                    </a>
                </div>
            `;
        } else {

            document.title = produto.nome + " | BYTE STORE";

            document.getElementById("imagemProduto").src = produto.imagem;
            document.getElementById("imagemProduto").alt = produto.nome;

            document.getElementById("nomeProduto").textContent = produto.nome;
            document.getElementById("categoriaProduto").textContent = produto.categoria;
            document.getElementById("descricaoProduto").textContent = produto.descricao;

            document.getElementById("precoProduto").textContent =
                produto.preco.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                });

            document.getElementById("descricaoCompleta").textContent =
                produto.descricaoCompleta;

            const listaTecnica = document.getElementById("informacoesTecnicas");

            produto.informacoes.forEach(informacao => {
                const item = document.createElement("li");
                item.textContent = informacao;
                listaTecnica.appendChild(item);
            });

            document.getElementById("adicionarCarrinho").addEventListener("click", () => {

                const quantidade = Number(document.getElementById("quantidade").value);

                if (!Number.isInteger(quantidade) || quantidade < 1 || quantidade > 10) {
                    alert("Escolha uma quantidade entre 1 e 10.");
                    return;
                }

                alert(
                    quantidade + " unidade(s) de " + produto.nome +
                    " selecionada(s). A integração com o carrinho será feita na próxima etapa."
                );

            });

        }
    </script>

</body>
</html>
